# Local run and single-box EC2 deployment.
# For RDS-backed deployments see docs/DEPLOY_AWS.md.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: grit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grit}
      POSTGRES_DB: grit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grit"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://grit:${POSTGRES_PASSWORD:-grit}@db:5432/grit
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      DEMO_MODE: ${DEMO_MODE:-true}
      LICENSE_KEY: ${LICENSE_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${APP_PORT:-80}:8080"

volumes:
  pgdata:
